[workspace]
resolver = "2"
members = [
    "crates/acquisition-core",
    "crates/acquisition-store",
    "crates/acquisition-plan",
    "crates/acquisition-cli",
    "crates/acquisition-mcp",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
