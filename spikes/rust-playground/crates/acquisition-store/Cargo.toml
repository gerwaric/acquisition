[package]
name = "acquisition-store"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "6"
# the world's short id (world.rs): twelve hex digits of the canonical root's SHA-256
sha2 = "0.10"
# the calling uid, for the private runtime directory (world.rs)
libc = "0.2"

[features]
# Destructive hooks for exercising failure paths; never in production builds.
test-hooks = []
