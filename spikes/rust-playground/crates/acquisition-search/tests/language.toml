construct = "worked_example"
text = '''league=Standard class=ring rarity=rare line("# to maximum Life" arg1>=90) pseudo.total_res>=60'''
canonical = '''league=Standard class=ring rarity=rare line("# to maximum Life" arg1>=90) pseudo.total_res>=60'''

