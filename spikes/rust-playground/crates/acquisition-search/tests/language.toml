[[case]]
construct = "values.has_on_computed"
text = '''has:pseudo.total_res'''
error = "has_on_computed"
readings = ['''pseudo.total_res>0''', '''undecided(pseudo.total_res)''']

[[case]]
construct = "values.sockets"
text = '''sockets>=5 links=6 sockets.red>=2'''
canonical = '''sockets>=5 links=6 sockets.red>=2'''

[[case]]
construct = "values.price"
text = '''has:priced price.amount>=5 price.currency=chaos price.lot=1'''
