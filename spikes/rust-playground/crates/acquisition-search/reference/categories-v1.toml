realms = ["pc", "xbox", "sony"]
source = "the trade site’s category filter, captured by the owner 2026-09-12 (search/trade-query/data/filters-2026-09-12.json, type_filters.category; SURFACES.md); the class table, classes v1; the reviewed grouping members, search/category/data/grouping-members.csv"
