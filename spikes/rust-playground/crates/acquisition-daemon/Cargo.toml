[package]
name = "acquisition-daemon"
version.workspace = true
edition.workspace = true

# The daemon as its own artifact (C1, C82; DAEMON-SPLIT-SLICE.md step 3):
# this package holds the daemon implementation and the `acqd` binary, the
# only GGG sender. It links the protocol crate and the store, never the
# client crate, the planner or a frontend; tools/docs-check.sh refuses
# those edges, and no package but this one may name it.

[[bin]]
name = "acqd"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
acquisition-protocol = { path = "../acquisition-protocol" }
acquisition-store = { path = "../acquisition-store" }
# TLS is required by real-GGG mode (ACQ_GGG=1); the mock peer stays loopback.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Linux: the Secret Service over D-Bus (zbus, pure Rust — nothing for the AppImage
# to carry). async-io, not tokio: the daemon calls the keyring from inside its
# runtime, and the crate's blocking bridge on tokio would enter a second one
# (a panic); on async-io it only blocks the thread (auth.rs, "keyring").
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"


[dev-dependencies]
# The queue-failure tests break `daemon.db` through a second connection
# (`break_queue`); the store crate carries no test-only door.
rusqlite = "0.32"
