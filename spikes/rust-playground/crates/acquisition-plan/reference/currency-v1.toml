# Currency reference table — v1 (C68), pricing slice step 1, 2026-09-04.
#
# Reference data is a fifth input, versioned by the build: reviewed,
# committed, every row citing its evidence, shipped inside the binary
# (`include_str!` in `src/currency.rs`), read-only, never in a store file,
# enumerable through every surface (`acq reference currency`), cited by
# version wherever used (decisions/pricing.md, C68). A tool may propose
# rows from a governed source (C79); a human commits. Rules the shape
# carries:
#
# - `tag` is the immutable identity intent cites (C67). Never removed,
#   never reused; a currency that falls out of use keeps its row, marked
#   `retired`. The v1 tags are the game's own words (below); the 2d draft's
#   four C++ tags that differed (`exa`, `chrom`, `jew`, `fuse`) became
#   aliases before any intent row cited them.
# - `emit` is the word GGG's client writes into a note after the amount,
#   and so the word the renderer writes (C74) — observed, never inferred:
#   the price-notes run of 2026-09-04, corpus `price-notes-2026-09-04.txt`
#   beside this file (T9, T10). Today every active row's `emit` is its
#   `tag`; if the game ever changes a word, `emit` moves and `tag` stays.
# - `aliases` are the extra words a parser accepts beyond `tag` and `emit`:
#   the legacy C++ tag where it differed, nothing more — the trade
#   indexer's loose matching is not modelled (C68). Resolution is exact
#   and case-sensitive.
# - `display` is the name the in-game price dialog shows for the word, as
#   the owner read it on 2026-09-04 (the fixture's third section); the
#   three retired rows keep the C++ display name.
# - `realms` is realm applicability (decisions/pricing.md, Parked: PoE2
#   currencies land as rows, not as a shape change). Every v1 row is a
#   PoE1 item; `pc` is the observed realm, `xbox` and `sony` follow the
#   C++ table's assumption that the PoE1 realms share one currency set.
# - `evidence` entries are `game:<date> note <note>` (the dialog wrote this
#   word into an item note, read back through the API — fixture, first
#   section), `game:<date> dialog <name>` (the display name the owner read
#   in the dialog — fixture, third section), `cpp:<path>@<master commit>
#   tag <tag>` (the C++ table's tag for the same currency),
#   `census:<date> …` (PRICING-SLICE.md, "What the census taught"), `T<n>`
#   (docs/design/trade-ground-truth.md), or `browser:<date> <who> <what>`
#   (SURFACES.md). Every row carries a `game:` entry; the loader checks.
#
# Row order is the dialog's own, then the retired rows. `status` is
# "draft" until the owner has read the table; the loader exposes it and
# gates nothing on it.
#
# Reviewed by: (nobody yet)

