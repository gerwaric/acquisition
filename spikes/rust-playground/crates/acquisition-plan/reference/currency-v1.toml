# Currency reference table — v1 DRAFT (C68), pricing slice step 2d, 2026-09-03.
#
# Reference data is a fifth input, versioned by the build: reviewed,
# committed, every row citing its evidence, shipped inside the binary
# from step 4, read-only, never in a store file (decisions/pricing.md,
# C68). This draft is the human-reviewed table in the making; a tool may
# propose rows, a human commits. Rules the shape carries from day one:
#
# - `tag` is the immutable identity intent cites (C67). Never removed,
#   never reused; a tag that falls out of use keeps its row. The v1 tags
#   are the C++ app's, so the 0.18 import (C73) maps 1:1.
# - `emit` is the text the renderer writes after an amount; `aliases` are
#   the words a parser accepts. Both are narrowed from trade claims
#   (`T<n>`) and dated browser observations under C79 (SURFACES.md); until
#   one exists a row says so in `evidence`, and the C++ tables stand as
#   the only cited source: emit = the tag (src/shop.cpp `SpoilerBuyout`),
#   aliases = `Currency::FromString` (src/currency.cpp).
# - `realms` is realm applicability (decisions/pricing.md, Parked: PoE2
#   currencies land as rows, not as a shape change). v1 rows are PoE1.
# - `evidence` entries are `cpp:<path>@<master commit>`, `census:<date> …`
#   (PRICING-SLICE.md, "What the census taught"), `T<n>`,
#   `browser:<date> <who> <what>`, or `game:<date> <where>` — a word GGG's
#   own client wrote into an item note, read back through the API (the
#   price-notes run of 2026-09-04, corpus in `price-notes-2026-09-04.txt`
#   beside this file). `browser:pending` marks a column not yet observed.
#
# Amended 2026-09-04 (C68): `emit` is the game's own word, so four v1
# rows below are wrong until the table step lands them (`exa`→`exalted`,
# `chrom`→`chrome`, `jew`→`jewellers`, `fuse`→`fusing`); `chisel`, `coin`
# and `silver` are no longer in the game and keep their rows, marked; 23
# words the game offers are missing. The rows are the table step's work
# (PRICING-SLICE.md, "Plan", step 1), not this header's.
#
# Reviewed by: (nobody yet — status stays "draft" until the owner commits
# the table at step 4, and every `browser:pending` is either observed or
# left pending on purpose.)

