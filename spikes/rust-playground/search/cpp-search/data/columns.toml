[sort]
suffix = "ItemSortKey::Suffix = std::tuple<QString, QString, QString>; // (PrettyName, uid, hash) -- built by Column::suffix as ItemSortKey::Suffix(pretty, item.id(), item.hash_v4()), i.e. Item::PrettyName(), then Item::id() (the GGG uid, m_uid), then Item::hash_v4() (m_hash). The comparator path reaches the same triple through the trailing `const Item&` in the sort tuple, whose Item::operator< is std::tie(PrettyName, m_uid, m_hash). ItemSortKey::operator< is std::tie(head, suffix) < std::tie(rhs.head, rhs.suffix), so the head decides first and the suffix only breaks ties. (src/sortkey.h; src/column.cpp:71-84; src/item.cpp:667)"
default = "Column 0 (Name), Qt::DescendingOrder. ItemsModel's constructor initialises m_sort_order = Qt::DescendingOrder, m_sort_column = 0, m_sorted = false (src/items_model.cpp:21-27); MainWindow::ModelViewRefresh then does setSortingEnabled(false) / header()->setSortIndicator(model.GetSortColumn(), model.GetSortOrder()) / setSortingEnabled(true) (src/ui/mainwindow.cpp:1360-1365), and QTreeView::setSortingEnabled(true) re-issues sortByColumn on the current indicator, which reaches ItemsModel::sort(0, Qt::DescendingOrder) because m_sorted is false. Nothing persists the sort column or order across sessions or across searches -- each Search owns its own ItemsModel and so starts at (0, Descending)."
protocol = "ItemsModel::ApplySort is a layout-preserving sort, never a reset: it emits layoutAboutToBeChanged first (with the target bucket's index in the `parents` list for a scoped sort, so listeners save only that subtree), then snapshots every valid child persistent index as (index, bucket row via Search::rowForSerial, column, shared_ptr<Item>), then sorts -- Search::SortBucket(only_bucket, ...) for one bucket or Search::Sort(column, order) over the materialized set (the flat By-Item bucket always, expanded By-Tab buckets whose sorted flag is invalid; collapsed buckets are left to sort on expand) -- then finds each snapshotted item's new row, calls changePersistentIndexList(from, to) and emits layoutChanged; only the view-wide form (only_bucket < 0) calls SetSorted(true). Sort-on-expand: ItemsModel::OnBucketExpanded marks the bucket materialized via Search::MarkBucketExpanded and runs the scoped ApplySort only when Bucket::sorted() is false; OnBucketCollapsed unmarks it and evicts its keys (a no-op in By-Item mode). Resident keys: Bucket::HydrateKeys materialises one ItemSortKey per item for exactly one column (the ResidentKeyStore's `column` pointer doubles as the residency marker) and Bucket::Sort orders a uint32 permutation by plain tuple comparison, then applies it in place to both the item and key vectors cycle by cycle; keys stay resident and index-aligned afterwards, and are evicted on collapse, on leaving a view mode (Search::SetViewMode), on deactivation (Search::EvictResidentKeys) and on a sort-column switch (ItemsModel::sort calls EvictResidentKeys when the column changes and InvalidateAllOrder whenever column or order changes). A buyout batch instead patches the affected resident entries (Bucket::RebuildKeyEntries via Search::InvalidateBuyoutOrder) and re-sorts through Resort/ResortBucket, which bypass sort()'s already-sorted skip."
price_head = "ItemSortKey::PriceHead = std::tuple<int, double> = (Buyout::currency.AsRank(), Buyout::value) for BuyoutManager::Get(item) -- the currency's position in the fixed rank table (CURRENCY_NONE 0, chromatic 1, alteration 2, jeweller 3, chance 4, chisel 5, perandus 6, fusing 7, alchemy 8, blessed 9, scouring 10, chaos 11, regret 12, regal 13, vaal 14, GCP 15, divine 16, exalted 17, mirror 18, silver coin 19), then the raw numeric value. Values are NOT normalised to a common currency, so ordering is currency-major. Unpriced items carry rank 0 and value 0 and sort first ascending. (src/column.cpp:444-448; src/currency.cpp)"
date_head = "ItemSortKey::DateHead = std::tuple<QDateTime> = (BuyoutManager::Get(item).last_update) -- the single timestamp of the last buyout change, compared as a QDateTime. Items with no buyout carry a null QDateTime, which compares less than every real timestamp, so they sort first ascending. (src/column.cpp:486-489)"

[views]
modes = "Search::ViewMode { ByTab = 0, ByItem = 1 }; m_current_mode starts at ByTab (Search's constructor). ByTab: one Bucket per stash tab / character, held in m_bucket_by_tab, built by grouping the filter-passing items by their stable location key and then sorted into display order. ByItem: exactly one Bucket, held in m_bucket_by_item, constructed with a default (invalid) ItemLocation and holding every filter-passing item in one flat list -- it is 'materialized by definition' (always sorted, always key-resident while the search is active) and ignores collapse. Search::buckets()/active_buckets() switch on the mode. SetViewMode evicts the outgoing mode's keys, keeps orders and flags, and rebuilds whichever side went stale (flat bucket from items() when entering ByItem, RebuildTabBucketsFromFlat when returning to ByTab), then sorts/hydrates the flat bucket and rebuilds the row lookups -- all inside one model reset (beginUpdate/endUpdate)."
bucket_key = "In ByTab an item is filed under LocationInventory::KeyFor(item->location()) = std::pair(ItemLocation::type(), ItemLocation::id()) -- the location TYPE (STASH or CHARACTER) plus the stable unique id (the GGG tab id, or the character id), deliberately NOT the tab label, not the tab index/position, and not fetch_id. Search::FilterItems keys a std::map<LocationInventory::Key, Bucket> on it; a new bucket is constructed from canonicalLocation(location), i.e. LocationInventory::Canonical -- the freshest metadata seen for that key, falling back to the item's own embedded location when the inventory has never seen it (or when no inventory was supplied). Map and Unique stash children: ItemLocation::id() stays the PARENT's id for children of MapStash/UniqueStash tabs while fetch_id is the child's own id, and fetch_id is excluded from the key, so every child's items collapse into the parent's single display bucket. Folder children are ordinary tabs with their own id and get their own bucket. Characters: type CHARACTER with id = the character's GGG id, so each character is one bucket whose header is the character name. In ByItem the single bucket's location is a default-constructed (invalid) ItemLocation and every item goes into it regardless of origin."
bucket_header = "ItemsModel::data on a top-level index (internalId() == 0) and only column 0. Qt::DisplayRole: \"All Items\" when the bucket location is not IsValid() (the ByItem flat bucket); otherwise ItemLocation::GetHeader() -- for STASH the string `#<tab_index+1>, \"<tab_label>\"`, for CHARACTER the bare character name -- with ` [<BuyoutManager::GetTab(location).AsText()>]` appended when the tab-level buyout IsActive(). Qt::BackgroundRole (STASH with a valid location only): QColor(location.getR(), getG(), getB()) when that colour is valid -- the tab's own colour from GGG. Qt::ForegroundRole (same guard): Util::recommendedForegroundTextColor(that background). Character and invalid-location buckets get no background/foreground override. Columns other than 0 on a bucket row return QVariant() for every role."
bucket_order = "ItemLocation::operator< (src/itemlocation.cpp:155): when the two types differ, every STASH location is less than every CHARACTER location -- stash tabs first, characters after. Within STASH, compare m_tab_id (the tab's index/position from GGG) ascending, so buckets follow in-game tab order. Within CHARACTER, compare QString::localeAwareCompare of m_character_sortname (the character name lowercased at construction) -- case-insensitive, locale-aware alphabetical. The display comparator actually used, Search's file-local bucketDisplayLess (src/search.cpp:29), applies operator< in both directions and, when neither is less (a positional tie, e.g. two tabs colliding on one index mid-refresh), breaks the tie with ItemLocation::id() -- one definition of display order shared by the refilter's std::sort and the delta path's insertion/reposition."
hidden_empty = "Empty buckets are added only when no filter is active. Search::FilterItems sets m_filtered = !active_filters.empty() -- 'filtered' means ANY filter state is active (not 'some item was rejected'), a definition that flips only on a filter edit. When !m_filtered, FilterItems adds a bucket for every BuyoutManager::GetStashTabLocations() entry and every LocationInventory::entries() entry that has no bucket yet, so unfiltered views show empty tabs (including tabs discovered mid-refresh by an empty delta). When m_filtered, that loop is skipped, so a tab with no filter-passing items has no row at all; the delta path matches this by removing a bucket row a delta emptied (Search::RemoveBucketRow). RebuildTabBucketsFromFlat applies the identical rule on a mode switch."
default_expanded = "Search::defaultExpanded() == m_filtered || (m_current_mode == ViewMode::ByItem) -- a filtered search, or any ByItem search, is default-expanded; an unfiltered ByTab search is not. FilterItems acts on it directly: when mode is ByTab and m_filtered, every fresh bucket gets SetExpanded(true) so the post-refilter sort pass establishes every visible order in one pass and the expansion restore finds valid flags; unfiltered fresh buckets start collapsed and MainWindow's RestoreViewExpansion re-expands exactly the remembered ones (expansion is remembered per LocationInventory::Key in Search::m_expanded_keys, never by header text). The flag is also what the delta/reconcile paths consult to decide whether to expand a newly inserted bucket row."
item_order_unsorted = "Arrival order -- the order of the Items vector handed to FilterItems. FilterItems walks that vector once and push_backs each passing item into the flat bucket and into its tab bucket (Bucket::AddItem is a plain push_back), so both view modes' buckets initially hold items in pipeline/collection order; Item::operator< plays no part until a Bucket::Sort runs. FilterItems then calls m_model.SetSorted(false), and the sort arrives from the model layer afterwards (the indicator pass, or sort-on-expand for collapsed ByTab buckets). Arrival-ordered append is also the delta path's fallback for a non-materialized bucket."
checkbox = "The bucket row's own Qt::CheckStateRole on column 0 -- the 'include this tab/character in Refresh checked tabs' flag. data(): QVariant() (no checkbox) for an invalid location, Qt::PartiallyChecked when BuyoutManager::GetRefreshLocked(location), else Qt::Checked/Qt::Unchecked from BuyoutManager::GetRefreshChecked(location). flags() adds Qt::ItemIsUserCheckable only on column 0 of a top-level row with a valid, unlocked location. setData persists it with BuyoutManager::SetRefreshChecked(location, value.toBool()) -- note toBool() maps Qt::PartiallyChecked (1) to true as well -- and then, because two tabs can share a name, walks every top-level row and emits dataChanged({Qt::CheckStateRole}) for each whose GetTabLocation(...).id() equals the changed location's id. The state lives in BuyoutManager::m_refresh_checked and is saved as DataStore JSON by BuyoutManager::Save() (deliberately separate from buyout persistence, per F22). ItemsModel::refreshCheckStates() repaints the whole column."

[model]
roles = "ItemsModel::data answers for two row kinds and returns QVariant() for anything else (invalid index, foreign model, column out of range). Top-level bucket rows (internalId() == 0, column 0 only): Qt::CheckStateRole -> the refresh checkbox (see [views].checkbox); Qt::DisplayRole -> the bucket header text plus any active tab buyout; Qt::BackgroundRole and Qt::ForegroundRole -> the tab colour and Util::recommendedForegroundTextColor of it, for valid STASH locations only. Child item rows: Qt::DisplayRole -> Column::value(item); Qt::ForegroundRole -> Column::color(item); Qt::DecorationRole -> Column::icon(item). No other role is answered anywhere (no ToolTipRole, no TextAlignmentRole, no UserRole); Qt::SizeHintRole, sizing and the item tooltip come from elsewhere in the UI. rowCount: buckets at the root, Bucket::size() under a bucket (answering through the A-prime replace translation while a flat replacement is notifying), 0 under an item. columnCount: Search::columns().size() at the root and under a bucket, 0 under an item. parent/index: a child index carries the bucket's stable serial as its internalId (never a row), resolved back through Search::rowForSerial."
editable = "setData accepts exactly one thing: role == Qt::CheckStateRole on column 0 of a top-level (bucket) row with a valid, non-refresh-locked location -- it writes BuyoutManager::SetRefreshChecked(location, value.toBool()) and returns true. Everything else returns false: item cells are not editable through the model at all (prices are set by the buyout controls and BuyoutManager, not by cell editing), and neither is the header. flags() reflects this: Qt::ItemIsSelectable | Qt::ItemIsEnabled | Qt::ItemIsUserCheckable for an eligible bucket row's column 0, Qt::ItemIsSelectable | Qt::ItemIsEnabled for every other valid index, and no flags at all for an invalid index, a foreign model, or an out-of-range column -- Qt::ItemIsEditable is never set."
header_roles = "headerData answers only orientation == Qt::Horizontal with role == Qt::DisplayRole and a section in [0, columns().size()): it returns QString(Search::columns()[section]->name()) -- the column's own header text, which is empty for the two extra ElementalDamageColumn sections (indices 11 and 12). Every other orientation and role (vertical headers included) returns QVariant(), so there are no row numbers, header tooltips, or header icons."
