# extracted by hand (no script) from master@946a4f51: src/column.cpp, sortkey.h, bucket.h, search.cpp, items_model.cpp, itemlocation.cpp; regenerate by re-reading those files at the commit
# Acquisition (C++/Qt) result table: columns, sorts, view modes.
# Every value read from master @ 946a4f51. Paths are repo-relative; line
# numbers are the line in `git show master:<path>`.
#
# Shared base machinery (applies to every column that does not override
# lt/key — i.e. all but Price and Date):
#
#   Column::parts (src/column.cpp:28) turns value(item).toString() into
#   four fields (d1, s1, d2, s2):
#     * matches ^\+?([\d.]+)%?$        -> d1 = the captured number
#       (so "12", "12.12", "10%", "+16%" sort numerically)
#     * else matches ^(\d+)([-/])(\d+)$
#         - separator "-"  -> d1 = 0.5 * (first + third)   ("12-14" -> 13)
#         - separator "/"  -> s1 = PrettyName, d2 = first  ("10/20" -> 10,
#           but only after PrettyName, which is a latent quirk)
#     * else                            -> s1 = the raw string, s2 = PrettyName
#   An absent value is QVariant(); .toString() is the null QString, so it
#   takes the last branch with s1 null -> absent values group first in
#   ascending order and then order by PrettyName.
#
#   Column::key (src/column.cpp:76) = { BaseHead(d1,s1,d2,s2), suffix }.
#   Column::lt (src/column.cpp:63) compares
#   std::tuple(d1, s1, d2, s2, const Item&); the trailing Item reference
#   makes the tie-break Item::operator< (src/item.cpp:667), which is
#   (PrettyName, uid, hash) -- the same triple as the key suffix, so
#   keyed and comparator order agree.
#
#   Default color (src/column.cpp:23) = QApplication::palette().color(
#   QPalette::WindowText).
#
#   "none" for icon means the subclass returns QVariant::fromValue(NULL)
#   from icon() -- a non-null QVariant holding 0, which Qt renders as no
#   decoration. Only InfluncedColumn ever returns a real QIcon.

