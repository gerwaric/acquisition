[[filter]]
index = 22
caption = "Quality"
group = "Misc"
payload = "minmax"
refresh = "Debounced"
accessor = "item.properties().find(\"Quality\") — found->second.toDouble(), else the default 0.0"
rule = "defaultProperty with defaultValue 0.0: present(item) is unconditionally true, so every item is compared, and an item with no \"Quality\" property is treated as quality 0 rather than skipped. The stored string has already had a leading \"+\" and a trailing \"%\" stripped at load, so \"+20%\" is stored as \"20\" and QString::toDouble() gives 20. Inclusive optional min and max."
