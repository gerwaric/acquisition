rule = "simpleProperty on \"Chance to Block\": present = the property exists; value = its string via QString::toDouble(); inclusive optional min and max; item without the property is rejected when active."
cite = "src/filters/filtermatchers.cpp:198-212; src/filters/filterspec.cpp:62-72, 137"
