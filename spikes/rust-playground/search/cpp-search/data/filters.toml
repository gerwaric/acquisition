[[filter]]
index = 14
caption = "Sockets"
group = "Sockets"
payload = "minmax"
refresh = "Debounced"
accessor = "item.sockets_cnt()"
rule = "itemMethod: present always true; value = m_sockets_cnt, set to the raw size of the JSON socket array (before the per-socket attribute check that can skip a socket). Inclusive optional min and max."
cite = "src/filters/filtermatchers.cpp:198-212; src/filters/filterspec.cpp:101-105, 138-140; src/item.cpp:501-517"
notes = "Counts the array length, not the sockets actually classified: a socket with neither `attr` nor `sColour` is `continue`d for colour purposes but still counted here (src/item.cpp:504, 515-517). An item with no sockets has 0 and is compared like any other (not skipped)."

[[filter]]
index = 15
caption = "Links"
group = "Sockets"
payload = "minmax"
refresh = "Debounced"
accessor = "item.links_cnt()"
rule = "itemMethod: present always true; value = m_links_cnt, the largest run of consecutive sockets sharing one `group` id as the socket array is walked in order. Inclusive optional min and max."
cite = "src/filters/filtermatchers.cpp:198-212; src/filters/filterspec.cpp:101-105, 141-143; src/item.cpp:505-529"
notes = "The counter resets only when the group id differs from the immediately preceding socket, so the value is the longest consecutive same-group run rather than the largest group by total membership; the two differ if a group's sockets are not contiguous in the array. 0 for an unsocketed item, and compared rather than skipped."

[[filter]]
index = 16
caption = "Colors"
group = "Sockets"
payload = "colors"
refresh = "Immediate"
accessor = "item.sockets()"
reads = "sockets() — the single whole-item ItemSocketGroup tally"
rule = "ColorsState holds optional r, g and b. If none is set the filter matches everything. Otherwise each unset component counts as 0 (value_or(0)) and Check() computes diff = max(0, need_r - got_r) + max(0, need_g - got_g) + max(0, need_b - got_b) against the item's whole-item tally, matching when diff <= got_w. So it is an at-least test per colour with the item's white sockets able to cover any shortfall across all three colours combined. The tally maps socket attr 'S'->r, 'D'->g, 'I'->b, 'G'->w, and an unclassifiable socket contributes to nothing."
cite = "src/filters/filtermatchers.cpp:213-236; src/filters/filterspec.cpp:50-52, 144; src/item.cpp:501-548"
notes = "White sockets substitute for any requested colour — docs/user/searching.md says only \"At least this many sockets of each colour\" and does not mention the white-socket substitution (doc-vs-code gap; code wins). The colour letters are the attribute codes S/D/I/G, not R/G/B. Immediate refresh, unlike the numeric Sockets/Links filters next to it."

[[filter]]
index = 17
caption = "Linked"
group = "Sockets"
payload = "colors"
refresh = "Immediate"
accessor = "item.socket_groups()"
reads = "socket_groups() — the per-group ItemSocketGroup tallies"
rule = "Same ColorsState and the same Check() formula as index 16, but applied per linked group: the item matches if ANY entry of socket_groups() satisfies diff <= that group's white count; an item with no satisfying group is rejected. All-unset state matches everything."
cite = "src/filters/filtermatchers.cpp:213-248; src/filters/filterspec.cpp:50-52, 145; src/item.cpp:501-549"
notes = "socket_groups() is built with an off-by-one shape: a fresh {0,0,0,0} accumulator is pushed the first time a new group id is seen (so the vector's first element is always an empty group), and the final accumulator is pushed after the loop (src/item.cpp:522-526, 549). The leading empty group is harmless for this matcher (it satisfies only an all-zero requirement, which is the inactive case) but means socket_groups().size() is group count + 1. Same white-substitution rule and same doc gap as index 16."

[[filter]]
index = 18
caption = "R. Level"
group = "Requirements"
payload = "minmax"
refresh = "Debounced"
accessor = "item.requirements()[\"Level\"], or 0.0 when absent"
rule = "requiredStat: present(item) is unconditionally true, so every item is compared. value = the int stored under \"Level\" in requirements() cast to double, or 0.0 if the key is absent. Inclusive optional min and max. requirements() is a std::map<QString,int> built by parsing each requirement's first value with QString::toInt()."
cite = "src/filters/filtermatchers.cpp:198-212; src/filters/filterspec.cpp:88-100, 146; src/item.cpp:487-499"
notes = "Absent requirement reads as 0 and the item is still compared, so an item with no level requirement passes any filter whose min is <= 0 and fails any min > 0 — it is never skipped. QString::toInt() on a non-integer string yields 0, and requirements whose value list is empty are dropped entirely (src/item.cpp:491-493). Note there is also a \"Level\" PROPERTY filter at index 23 — the two read different maps under the same key."

