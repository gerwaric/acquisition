payload = "minmax"
refresh = "Debounced"
accessor = "item.pDPS()"
rule = "itemMethod: present always true, inclusive optional min/max against item.pDPS(), which returns 0 unless BOTH the \"Physical Damage\" property and the \"Attacks per Second\" property are present."
cite = "src/filters/filtermatchers.cpp:198-212; src/filters/filterspec.cpp:101-105, 127-128; src/item.cpp:576-589"
notes = "Same 0-for-absent caveat as index 5."

