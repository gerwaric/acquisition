[[filter]]
index = 26
caption = "Alt. art"
group = "MiscFlags"
payload = "bool"
refresh = "Immediate"
accessor = "MatchesAltart(item) -> item.icon()"
rule = "BoolState holds one `checked` flag. An unchecked box matches everything (`!state.checked || predicate(item)`); a checked box requires the predicate. Here the predicate is MatchesAltart, which returns true when item.icon() contains any of 117 hard-coded needle strings (case-sensitive QString::contains, substring anywhere in the icon URL)."
cite = "src/filters/filtermatchers.cpp:249-252, 16-159; src/filters/filterspec.cpp:33-36, 155"
notes = "The needle list is a static QStringList literal grouped by season, ending at the \"winterheart season\" block; five entries are not filenames but base64-looking fragments (\"dGlsbGF0ZUFsdCI7czoy\", \"IjtzOjI6InNwIjtkOjAu\", \"cy9CbG9ja0ZsYXNrMiI7\", \"dCI7czoyOiJzcCI7ZDow\", \"bHQiO3M6Mjoic3AiO2Q6\") matching the encoded middle of an icon URL, and a few are plain unique-item filenames (\"Fencoil.png\", \"TopazRing.png\", \"RingUnique1.png\", \"BringerOfRain.png\", \"WinterHeart.png\", \"Empty-Socket2.png\") whose substring could collide with a non-alt-art icon. There is no negation: the filter can only narrow to alt art, never exclude it."

