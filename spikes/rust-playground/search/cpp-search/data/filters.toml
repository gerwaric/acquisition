[[filter]]
index = 37
caption = "Mods"
group = "Mods"
payload = "mods"
refresh = "Debounced"
accessor = "item.mod_table()"
rule = "ModsState holds a vector of ModRow{mod, optional min, optional max}. The matcher iterates every row and ANDs them: a row whose `mod` string is empty is skipped entirely; otherwise the item's mod_table() — an unordered_map<QString,double> keyed by the mod's display name — must contain that exact key (case-sensitive, exact-string `count`), or the item is rejected outright. When the key is present, the row fails if `row.min.has_value() && value < *row.min` or `row.max.has_value() && value > *row.max`, so both bounds are inclusive and either may be omitted. An empty row list, or a list of only empty-mod rows, matches every item — but note isActive() is `!rows.empty()`, so a list of blank rows makes the filter active while matching everything."
cite = "src/filters/filtermatchers.cpp:253-274; src/filters/filterstate.h:56-69; src/filters/filterspec.cpp:190; src/item.h:57, 141; src/item.cpp:431-435; src/modlist.cpp:351-395"
notes = "ModsPayload is empty — the rule lives entirely in the state, and the whole row set is a single catalog entry rather than one filter per row. The table is built by AddModToTable over the union of the enchantMods/implicitMods/fracturedMods/explicitMods/craftedMods/mutatedMods lists, so affix category is erased: one row matches a line wherever it appears (docs/user/mods-and-pseudomods.md agrees). Numbers in a mod line are replaced with \"#\" to form the lookup key (regex \"([0-9\\\\.]+)\"), and lines starting with \"1 Added Passive Skill\" are exempted from that substitution. Natural mods ASSIGN (`output[m_name] = result`), so a duplicated line keeps only the last value, while summing pseudomods ACCUMULATE (`output[pseudo_mod] += value`) — matching the doc's \"only one value is kept\" plus \"… total …\" sums. The form's per-row completer is a UI concern (src/ui/modsfilterform.cpp:184-196) and does not restrict what a saved row's `mod` string may be."

[consumption]
and_semantics = "Search::FilterItems builds `active_filters`, the indices whose FilterState IsActive(), then for each item runs those filters in catalog order and short-circuits on the first MatchesFilter that returns false; only an item that passes every active filter is kept. Pure conjunction, no OR and no grouping. Inactive filters are never evaluated, so a filter's rule for an all-default state is unobservable. m_filtered is set to `!active_filters.empty()` — \"filtered\" means at least one filter is active, not that any item was rejected. The delta paths (Search::ApplyTabDelta and the published-snapshot reconciliation) use Search::MatchesActiveFilters(item), which is the same conjunction written as a loop over all states with an inline IsActive() guard. FilterItems also short-circuits the whole pass when the refresh reason is TabChanged and neither m_states_dirty nor m_items_dirty is set."
active_test = "IsActive(FilterState) std::visits the variant and calls the alternative's own isActive(): TextState -> !query.isEmpty(); ComboState -> !value.isEmpty() (so the <any> sentinel, which the form stores as an empty string, is inactive); MinMaxState -> min.has_value() || max.has_value(); ColorsState -> r || g || b has_value(); BoolState -> checked; ModsState -> !rows.empty() (any row at all, even one with an empty mod name and no bounds). MakeDefaultState gives each spec the value-initialised state for its payload, which is inactive in every case. Search::setFilterState compares the new state to the current one and only sets m_states_dirty when they differ — every state type has a defaulted operator==."
refresh_modes = "The mode is a per-spec property (FilterSpec::refreshMode) that the form turns into a signal target: FilterCallbacks::forMode returns `onChanged` for RefreshMode::Immediate and `onChangedDelayed` for RefreshMode::Debounced, and each widget adapter connects its edit signal to that. The delayed path calls MainWindow::OnDelayedSearchFormChange, which (re)starts a single-shot QTimer with SEARCH_UPDATE_DELAY_MS = 350 ms whose timeout runs OnSearchFormChange; MainWindow::FlushPendingSearchFormChange fires the pending change synchronously before the form is rebound to another search tab. Immediate captions (from the `boolean` and `colors` factories): Colors, Linked, Alt. art, Priced, Unidentified, Influenced, Crafted, Enchanted, Corrupted, Fractured, Split, Synthesized, Mutated — 13 in all (11 boolean + 2 colors). Debounced captions (the `text`, `combo`, `minMax` factories and the Mods spec): Tab, Name, Category, Rarity, Crit., DPS, pDPS, eDPS, cDPS, APS, Armour, Evasion, Shield, Block, Sockets, Links, R. Level, R. Str, R. Dex, R. Int, Quality, Level, Map Tier, ilvl, Mods — 25 in all (2 text + 2 combo + 20 minmax + 1 mods)."
altart = "MatchesAltart(item) returns true when item.icon() contains at least one of a static list of 117 hard-coded strings, tested with QString::contains (case-sensitive substring, anywhere in the icon URL) and short-circuiting on the first hit. The list is grouped by comment into season 1-11 plus the emberwake, bloodgrip, soulthirst and winterheart seasons; most entries are alt-art icon filenames ending in .png (\"RedBeak2.png\", \"TabulaRasaAlt.png\", …) and five are base64-looking URL fragments with no extension. Nothing about the item other than its icon string is consulted."
outside_catalog = "none — every item-level predicate Search applies comes from the catalog. FilterItems' only other membership decision is bucket-level, not item-level: when no filter is active it also materialises empty By-Tab buckets from BuyoutManager::GetStashTabLocations() and the LocationInventory, and when any filter is active it simply omits them, so empty tabs disappear while filtering. Items are never dropped by location, visibility, or any other out-of-catalog rule."
