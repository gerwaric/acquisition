# extracted by hand (no script) from master@946a4f51: src/filters/filterspec.cpp, filtermatchers.cpp, filterstate.cpp, item.cpp, search.cpp, ui/searchform.cpp; regenerate by re-reading those files at the commit
# Acquisition (C++/Qt) search-filter catalog, read at commit 946a4f51 on branch
# master. One [[filter]] per FilterSpec pushed by BuildFilterCatalog, in order
# (src/filters/filterspec.cpp:107-191; specs.reserve(38) and 38 push_backs).
#
# Every value below comes from the files read at that commit. Line citations are
# `path:line` / `path:line-line` on master.
#
# Shared vocabulary, from the four payload factories in filterspec.cpp:
#   simpleProperty(p, caption, group)  -> minmax; value = properties().at(p).toDouble(),
#                                        present = properties().count(p)   (:62-72)
#   defaultProperty(p, caption, g, d)  -> minmax; value = properties()[p] or d if absent,
#                                        present = always true              (:73-87)
#   requiredStat(p, caption, group)    -> minmax; value = requirements()[p] or 0.0 if absent,
#                                        present = always true              (:88-100)
#   itemMethod(caption, group, fn)     -> minmax; value = fn(item), present = always true (:101-105)
# The `text` factory is always Debounced (:37-40), `combo` always Debounced (:41-49),
# `minMax` always Debounced (:53-61), `boolean` always Immediate (:33-36), and
# `colors` always Immediate and always FilterGroup::Sockets (:50-52).

[[filter]]
index = 0
caption = "Tab"
group = "TopForm"
payload = "text"
refresh = "Debounced"
accessor = "item.location().GetHeader()"
rule = "TextState holds one `query` string. The item matches when the accessor's value, lowercased, contains the query, lowercased — a case-insensitive substring test with no anchoring and no word splitting. GetHeader() returns `#<tab_id+1>, \"<tab_label>\"` for a stash location, the character name for a character location, and the empty string for any other location type, so the quoting and the leading `#N, ` are part of the haystack."
cite = "src/filters/filtermatchers.cpp:161-164; src/filters/filterspec.cpp:109-111; src/itemlocation.cpp:72-82"
notes = "The stash form means a query of `#3` or `\", \"` can match, and an item in a location whose type is neither STASH nor CHARACTER has an empty haystack, so it only matches an empty (hence inactive) query. docs/user/searching.md calls this \"Substring of the stash tab or character name\", omitting the `#N, ` prefix and the quotes that the code puts in the haystack."

[[filter]]
index = 1
caption = "Name"
group = "TopForm"
payload = "text"
refresh = "Debounced"
accessor = "item.PrettyName()"
rule = "Same text rule as index 0: case-insensitive substring of the accessor's value. PrettyName() returns `name + \" \" + typeLine` when the item has a name, and just typeLine when the name is empty."
cite = "src/filters/filtermatchers.cpp:161-164; src/filters/filterspec.cpp:112-113; src/item.cpp:185-192"
notes = "The haystack is name AND base/type line joined by one space, not the name alone: a query can straddle the join. docs/user/searching.md says \"Substring of the item name\" — the code also searches the type line (doc-vs-code disagreement; code wins). m_typeLine is the hybrid baseTypeName for hybrid non-vaal-gem items (src/item.cpp:108-120)."

[[filter]]
index = 2
caption = "Category"
group = "TopForm"
payload = "combo"
refresh = "Debounced"
accessor = "item.category()"
choices = "kAnyFilterChoice followed by GetItemCategories() — the sorted, de-duplicated set of RePoE item-class display names (repoe::ItemClass::name) loaded by InitItemClasses; the list is NOT lowercased when built"
any = "<any>"
rule = "ComboState holds one `value` string. An empty value matches every item (the whole filter short-circuits to true). Otherwise ComboMatchKind::CategoryContains does `item.category().contains(state.value)` — QString::contains with the default Qt::CaseSensitive. Both sides are lowercase in practice: the form lowercases the combo's current text before storing it when matchKind is CategoryContains, and GetItemCategory() lowercases the class name it assigns to m_category. An item whose base type could not be categorised has an empty m_category and therefore matches no non-empty query."
cite = "src/filters/filtermatchers.cpp:165-173; src/filters/filterspec.cpp:114-120; src/ui/searchform.cpp:120-131; src/itemcategories.cpp:114-140, 59-70"
notes = "Substring, not equality: a query that is a prefix/infix of several class names matches all of them. The `<any>` sentinel never reaches the matcher — ComboFilterForm::saveTo maps it to an empty QString (searchform.cpp:129), which is also what isActive() treats as inactive. The form's visible label is \"Type\", not the spec caption \"Category\" (searchform.cpp:92-93), which is why docs/user/searching.md lists the filter as \"Type\". The choices list is mixed-case while the stored query is lowercased, so the combo text and the state differ by case; loadFrom re-finds the entry with Qt::MatchFixedString (searchform.cpp:138)."

[[filter]]
index = 3
caption = "Rarity"
group = "TopForm"
payload = "combo"
refresh = "Debounced"
accessor = "item.frameType()"
choices = "RarityChoices(), verbatim: [\"<any>\", \"Normal\", \"Magic\", \"Rare\", \"Unique\", \"Unique (Foil)\", \"Any Non-Unique\"]"
any = "<any>"
rule = "Empty value matches everything. Otherwise ComboMatchKind::Rarity switches on item.frameType() and compares the query to fixed positions of RarityChoices(): FRAME_TYPE_NORMAL matches choices[1] (\"Normal\") or choices[6] (\"Any Non-Unique\"); FRAME_TYPE_MAGIC matches choices[2] or choices[6]; FRAME_TYPE_RARE matches choices[3] or choices[6]; FRAME_TYPE_UNIQUE matches choices[4] (\"Unique\") only; FRAME_TYPE_FOIL and FRAME_TYPE_SUPPORTER_FOIL match choices[5] (\"Unique (Foil)\") only; every other frame type matches nothing. Exact string equality, case-sensitive."
cite = "src/filters/filtermatchers.cpp:165-197; src/filters/filterspec.cpp:121-123; src/filters/filterspec.cpp:13-23"
notes = "\"Any Non-Unique\" deliberately excludes foils as well as uniques. Items with any other frame type (including the default m_frameType of -1 for an item whose JSON carried no frameType, src/item.h:174 and src/item.cpp:144-146) are rejected by every non-empty rarity query, i.e. an active Rarity filter silently drops uncategorised frames. The choice list is not derived from the FrameType enum, so positions 1-6 are load-bearing."

[[filter]]
index = 4
caption = "Crit."
group = "Offense"
payload = "minmax"
refresh = "Debounced"
accessor = "item.properties().at(\"Critical Strike Chance\").toDouble()"
rule = "MinMaxState holds optional min and optional max. present(item) is `item.properties().count(\"Critical Strike Chance\")`: if the item has no such property, the item matches only when both min and max are unset — which is exactly the inactive case, so an active filter rejects every item lacking the property. When present, the value is the property's stored string run through QString::toDouble(); it fails if `min.has_value() && *min > value` or `max.has_value() && *max < value`, so both bounds are inclusive and either may be omitted."
cite = "src/filters/filtermatchers.cpp:198-212; src/filters/filterspec.cpp:62-72, 124"
notes = "properties() is a std::map<QString,QString>; only the first value of a property is stored, and only \"Quality\" (leading \"+\" and trailing \"%\" stripped), \"Level\" (trailing \"(Max)\" stripped) and \"Stack Size\" get any string cleanup at load (src/item.cpp:450-473). Every other property, this one included, is handed to QString::toDouble() verbatim, and QString::toDouble() returns 0.0 for any string it cannot parse in full — so a stored value with a trailing unit character would compare as 0. Settled 2026-09-13 by a property the owner copied from the C++ app's JSON: `{\"name\": \"Critical Strike Chance\", \"type\": 12, \"values\": [[\"8.00%\", 0]]}` — the string carries a trailing \"%\", so toDouble() yields 0.0 for every item and this filter compares every item as 0: any min above 0 rejects all, a bare max admits all. The Crit column still sorts correctly because Column::parts tolerates the \"%\"."

[[filter]]
index = 5
caption = "DPS"
group = "Offense"
payload = "minmax"
refresh = "Debounced"
accessor = "item.DPS()"
rule = "itemMethod: present(item) is unconditionally true, so every item is compared. value = item.DPS() = pDPS() + eDPS() + cDPS(); each of those returns 0 when its damage property or \"Attacks per Second\" is missing. Inclusive min and max as in index 4, either side optional."
cite = "src/filters/filtermatchers.cpp:198-212; src/filters/filterspec.cpp:101-105, 125-126; src/item.cpp:571-574"
notes = "Because present is always true and the accessor returns 0 for an item with no damage, a `min` of 0 (or any min <= 0) admits every item and a bare `max` admits every non-weapon — unlike the simpleProperty filters, which skip items lacking the property. The derivation of DPS from Physical/Elemental/Chaos damage and APS is item.cpp's business (catalogued separately)."

[[filter]]
