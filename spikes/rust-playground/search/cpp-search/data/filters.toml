cite = "src/filters/filtermatchers.cpp:198-212; src/filters/filterspec.cpp:101-105, 129-130; src/item.cpp:591-606"
notes = "Same 0-for-absent caveat as index 5. Elemental damage is the one property NOT written into properties(): it is parsed into m_elemental_damage instead (src/item.cpp:444-449)."

